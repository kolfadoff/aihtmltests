<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afinador Vocal Gráfico SATB - @mattcoutto</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --panel-bg: rgba(24, 24, 29, 0.95);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --green-target: #10b981;
            --green-glow: #00ff88;
            --red-voice: #f43f5e;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --warning: #f59e0b;
            --surface: #1f1f26;
            --surface-hover: #2a2a35;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-dark);
            color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            display: flex; flex-direction: column;
        }

        /* --- CABEÇALHO --- */
        .controls-header {
            width: 100%; background: var(--panel-bg); border-bottom: 1px solid var(--panel-border);
            padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;
            z-index: 10; flex-shrink: 0;
        }

        .controls-row {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; width: 100%;
        }

        .advanced-settings {
            display: none;
            flex-direction: column; gap: 8px; width: 100%;
            padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .advanced-settings.show { display: flex; }

        @media (min-width: 850px) {
            .btn-toggle-settings { display: none !important; }
            .advanced-settings { display: flex !important; flex-direction: row; flex-wrap: wrap; justify-content: center; border-top: none; padding-top: 0; }
        }

        /* --- BARRA DE STATUS --- */
        .status-container {
            width: 100%; background: #121217; padding: 8px 14px; box-sizing: border-box;
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between;
            border-bottom: 1px solid #222; font-family: 'SF Mono', Consolas, monospace; font-size: 0.9rem;
            flex-shrink: 0; z-index: 5;
        }

        .target-badge { color: var(--green-glow); font-weight: bold; }
        .voice-badge { color: var(--red-voice); font-weight: bold; }
        .in-tune { color: #00ffff !important; text-shadow: 0 0 8px rgba(0,255,255,0.5); }
        .auto-success { color: #00ff88 !important; text-shadow: 0 0 10px rgba(0,255,136,0.8); font-weight: 800; }

        /* --- ÁREA DO CANVAS --- */
        .canvas-container {
            flex-grow: 1; position: relative; width: 100%; overflow: hidden;
        }
        #pitchCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        /* --- BOTÕES E CONTROLES --- */
        button, select {
            background: var(--surface); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 500;
            cursor: pointer; outline: none; height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box;
            transition: all 0.15s ease;
        }

        button:hover, select:hover { background: var(--surface-hover); border-color: rgba(255, 255, 255, 0.25); }
        button:active { transform: translateY(1px); }

        @keyframes pulse-red {
            0%, 100% { background-color: #7f1d1d; border-color: #ef4444; color: #fee2e2; box-shadow: 0 0 12px rgba(239, 68, 68, 0.6); }
            50% { background-color: #450a0a; border-color: #991b1b; color: #fca5a5; box-shadow: 0 0 2px rgba(239, 68, 68, 0.2); }
        }
        button.mic-btn.blinking-red {
            animation: pulse-red 1.2s infinite ease-in-out;
            font-weight: bold;
        }
        button.mic-btn.active { background: #064e3b; border-color: #059669; color: #34d399; font-weight: 600; animation: none; box-shadow: none; }
        
        .led-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        button.mic-btn.active .led-dot { background: var(--green-glow); box-shadow: 0 0 8px var(--green-glow); }

        button.primary-action { background: var(--accent); border-color: #818cf8; color: #fff; font-weight: 600; }
        button.hold-active { background: var(--warning); border-color: #fbbf24; color: #000; font-weight: bold; }
        
        button.auto-btn { background: #27272a; border-color: rgba(255,255,255,0.15); }
        button.auto-btn.auto-active { background: #4c1d95; border-color: #8b5cf6; color: #ddd6fe; font-weight: bold; box-shadow: 0 0 10px rgba(139, 92, 246, 0.5); }

        .key-badge {
            background: rgba(0, 0, 0, 0.35); border-radius: 4px; padding: 1px 5px; font-size: 0.7rem; font-family: monospace; color: var(--text-muted);
        }
        button.primary-action .key-badge { background: rgba(0,0,0,0.25); color: #e0e7ff; }

        .slider-group, .toggle-group {
            display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.3);
            padding: 0 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.08); 
            font-size: 0.8rem; color: var(--text-muted); height: 34px; box-sizing: border-box;
        }
        .slider-group input[type="range"] { width: 70px; accent-color: var(--accent); height: 4px; cursor: pointer; }
        .toggle-group label { color: var(--text); font-weight: 500; cursor: pointer; }
        input[type="checkbox"] { accent-color: var(--green-target); width: 15px; height: 15px; margin: 0; cursor: pointer; }

        .btn-toggle-settings { background: transparent; border: 1px solid rgba(255,255,255,0.2); width: 100%; margin-top: 4px; }

        /* --- CRÉDITOS E BOTÃO PIX --- */
        .footer-credits {
            position: absolute; bottom: 12px; right: 14px; z-index: 10;
            background: rgba(18, 18, 23, 0.88); padding: 6px 12px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); font-size: 0.78rem; color: var(--text-muted);
            backdrop-filter: blur(8px); display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .footer-credits strong { color: #fff; font-weight: 600; }
        
        button.btn-pix {
            background: #059669; border-color: #10b981; color: #ffffff;
            font-size: 0.75rem; font-weight: 600; padding: 4px 10px; height: 28px;
            border-radius: 5px; transition: all 0.2s ease;
        }
        button.btn-pix:hover { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
        button.btn-pix.copied { background: #4f46e5; border-color: #818cf8; color: #fff; }

        .pause-watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 800; color: rgba(245, 158, 11, 0.15);
            z-index: 5; pointer-events: none; display: none; text-align: center;
        }
        @media (min-width: 768px) { .pause-watermark { font-size: 5rem; } }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="controls-header">
        <!-- Controles Principais -->
        <div class="controls-row">
            <button id="btn-mic" class="mic-btn blinking-red" title="Clique para ativar a captação de voz">
                <span class="led-dot"></span> Ativar Microfone
            </button>
            
            <select id="satb-select">
                <option value="S">🎵 Soprano (Mi4 - Lá5)</option>
                <option value="A">🎵 Contralto (Lá3 - Mi5)</option>
                <option value="T">🎵 Tenor (Mi3 - Sol4)</option>
                <option value="B">🎵 Baixo (Sol2 - Dó4)</option>
            </select>

            <button id="btn-new-note" class="primary-action">
                🎹 Nova Nota <span class="key-badge">Enter</span>
            </button>
            
            <button id="btn-repeat">
                🔁 Repetir Nota <span class="key-badge">R</span>
            </button>

            <button id="btn-auto" class="auto-btn" title="Avança automaticamente ao acertar a nota">
                🤖 Modo Automático <span class="key-badge">A</span>
            </button>
            
            <button id="btn-hold" class="hold-btn">
                ⏸️ Congelar / Hold <span class="key-badge">Espaço</span>
            </button>
        </div>

        <button id="btn-toggle-settings" class="btn-toggle-settings">⚙️ Ajustes de Calibração e Zoom</button>

        <!-- Controles Avançados -->
        <div id="advanced-settings" class="advanced-settings">
            <div class="controls-row">
                <select id="tolerance-select">
                    <option value="10">🎯 Exigência: Alta (±10 cents)</option>
                    <option value="25">🎯 Exigência: Média (±25 cents)</option>
                    <option value="40" selected>🎯 Exigência: Leve (±40 cents - Padrão)</option>
                    <option value="50">🎯 Exigência: Baixa (±50 cents)</option>
                </select>

                <div class="slider-group">
                    <span>🔊 Vol:</span>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1.0">
                </div>
                
                <button id="btn-sine">〰️ Teste Senoidal (5s)</button>
            </div>
            
            <div class="controls-row">
                <select id="zoom-select">
                    <option value="octave">↕️ Zoom: 1 Oitava</option>
                    <option value="voice" selected>↕️ Zoom: Extensão da Voz (Padrão)</option>
                    <option value="wide">↕️ Zoom: Amplo (3 Oitavas)</option>
                </select>

                <select id="time-select">
                    <option value="5" selected>↔️ Tempo: 5s (Padrão / Detalhado)</option>
                    <option value="10">↔️ Tempo: 10s</option>
                    <option value="30">↔️ Tempo: 30s</option>
                    <option value="60">↔️ Tempo: 60s</option>
                </select>

                <div class="toggle-group">
                    <input type="checkbox" id="check-sound" checked>
                    <label for="check-sound">Som</label>
                </div>

                <div class="toggle-group">
                    <input type="checkbox" id="check-green" checked>
                    <label for="check-green">Gabarito</label>
                </div>
            </div>
        </div>
    </div>

    <!-- STATUS -->
    <div class="status-container">
        <span class="target-badge" id="target-display">Alvo: Clique "Nova Nota"</span>
        <span class="voice-badge" id="voice-display">Voz: Microfone desativado!</span>
    </div>

    <!-- ÁREA DO GRÁFICO -->
    <div class="canvas-container">
        <div id="pause-watermark" class="pause-watermark">CONGELADO</div>
        <canvas id="pitchCanvas"></canvas>

        <!-- CRÉDITOS E BOTÃO PIX -->
        <div class="footer-credits">
            <span>Criado por <strong>@mattcoutto</strong></span>
            <button id="btn-pix" class="btn-pix" title="Clique para copiar a chave Pix">💜 Contribua (Pix)</button>
        </div>
    </div>

    <script>
        const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        
        const RANGES = {
            S: { min: 64, max: 81 }, A: { min: 57, max: 76 },
            T: { min: 52, max: 67 }, B: { min: 43, max: 60 }
        };

        let audioCtx = null, analyser = null, micStream = null;
        let activeSynthNodes = []; 
        
        let targetMidi = 64, currentVoiceMidi = null;
        let isMicActive = false, isHold = false;
        
        let isAutoMode = false;
        let autoHitCounter = 0;
        let isAutoTransitioning = false;
        const REQUIRED_HIT_FRAMES = 42;
        
        // NOVO: Trava temporal para ignorar o feedback acústico do alto-falante no Modo Automático
        let referenceAudioEndTime = 0;
        
        let history = []; 
        const MAX_BUFFER = 3600; 

        const btnToggleSettings = document.getElementById('btn-toggle-settings');
        const advancedSettings = document.getElementById('advanced-settings');
        btnToggleSettings.addEventListener('click', () => {
            advancedSettings.classList.toggle('show');
            resizeCanvas(); 
        });

        const btnMic = document.getElementById('btn-mic');
        const btnNewNote = document.getElementById('btn-new-note');
        const btnRepeat = document.getElementById('btn-repeat');
        const btnAuto = document.getElementById('btn-auto');
        const btnSine = document.getElementById('btn-sine');
        const btnHold = document.getElementById('btn-hold');
        const btnPix = document.getElementById('btn-pix');
        
        const selectSatb = document.getElementById('satb-select');
        const selectZoom = document.getElementById('zoom-select');
        const selectTime = document.getElementById('time-select');
        const selectTolerance = document.getElementById('tolerance-select');
        const volumeSlider = document.getElementById('volume-slider');
        const checkSound = document.getElementById('check-sound');
        const checkGreen = document.getElementById('check-green');
        const targetDisplay = document.getElementById('target-display');
        const voiceDisplay = document.getElementById('voice-display');
        const pauseWatermark = document.getElementById('pause-watermark');
        
        const canvasContainer = document.querySelector('.canvas-container');
        const canvas = document.getElementById('pitchCanvas');
        const ctx = canvas.getContext('2d');

        btnPix.addEventListener('click', () => {
            const pixKey = "llord.matt@gmail.com";
            const originalText = btnPix.innerHTML;
            
            navigator.clipboard.writeText(pixKey).then(() => {
                btnPix.innerHTML = "✓ Chave Copiada!";
                btnPix.classList.add('copied');
                setTimeout(() => {
                    btnPix.innerHTML = originalText;
                    btnPix.classList.remove('copied');
                }, 2500);
            }).catch(() => {
                alert(`Chave Pix para contribuição: ${pixKey}`);
            });
        });

        function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
        function freqToMidi(freq) { return 12 * Math.log2(freq / 440) + 69; }
        
        function getNoteName(midi) {
            const rounded = Math.round(midi);
            const name = NOTE_NAMES[rounded % 12];
            const octave = Math.floor(rounded / 12) - 1;
            return `${name}${octave}`;
        }

        function generateRandomNote() {
            if (!audioCtx) initAudio();
            const voice = selectSatb.value;
            const range = RANGES[voice];
            
            let newNote;
            do {
                newNote = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
            } while (newNote === targetMidi);
            
            targetMidi = newNote;
            autoHitCounter = 0;
            isAutoTransitioning = false;
            
            const freq = midiToFreq(targetMidi);
            const autoBadge = isAutoMode ? " [🤖 AUTO]" : "";
            targetDisplay.textContent = `Alvo: ${getNoteName(targetMidi)}${autoBadge}`;
            
            if (isHold) toggleHold();
            playPianoNote();
        }

        function playPianoNote() {
            if (!audioCtx) return;
            
            activeSynthNodes.forEach(node => { try { node.stop(); node.disconnect(); } catch(e){} });
            activeSynthNodes = [];

            if (checkSound.checked) {
                const vol = parseFloat(volumeSlider.value);
                const freq = midiToFreq(targetMidi);
                const now = audioCtx.currentTime;
                
                // Em Modo Automático, a nota toca por apenas 2,5s para não atrasar o treino. No manual, 6s.
                const duration = isAutoMode ? 2.5 : 6.0; 
                
                // Define quando o áudio termina + 0.25s de margem de segurança acústica para o eco da sala
                referenceAudioEndTime = now + duration + 0.25;

                const masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0, now);
                masterGain.gain.linearRampToValueAtTime(vol, now + 0.015);
                masterGain.gain.exponentialRampToValueAtTime(vol * 0.25, now + 0.8);
                masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                masterGain.connect(audioCtx.destination);

                const filter = audioCtx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.setValueAtTime(freq * 5, now);
                filter.frequency.exponentialRampToValueAtTime(freq * 1.2, now + duration);
                filter.connect(masterGain);

                const osc1 = audioCtx.createOscillator();
                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(freq, now);
                osc1.connect(filter);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                gain2.gain.value = 0.35; 
                osc2.type = 'sawtooth';
                osc2.frequency.setValueAtTime(freq, now);
                osc2.detune.value = 4; 
                osc2.connect(gain2);
                gain2.connect(filter);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration);
                osc2.stop(now + duration);

                activeSynthNodes.push(osc1, osc2);
            } else {
                referenceAudioEndTime = 0;
            }
        }

        function playSineReference() {
            if (!audioCtx) initAudio();
            activeSynthNodes.forEach(node => { try { node.stop(); node.disconnect(); } catch(e){} });
            activeSynthNodes = [];

            if (checkSound.checked) {
                const vol = parseFloat(volumeSlider.value);
                const freq = midiToFreq(targetMidi);
                const now = audioCtx.currentTime;
                const duration = 5.0;
                
                referenceAudioEndTime = now + duration + 0.25;

                const masterGain = audioCtx.createGain();
                masterGain.gain.setValueAtTime(0, now);
                masterGain.gain.linearRampToValueAtTime(vol, now + 0.05); 
                masterGain.gain.setValueAtTime(vol, now + duration - 0.1);
                masterGain.gain.linearRampToValueAtTime(0.0001, now + duration); 
                masterGain.connect(audioCtx.destination);

                const osc = audioCtx.createOscillator();
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(freq, now);
                osc.connect(masterGain);

                osc.start(now);
                osc.stop(now + duration);

                activeSynthNodes.push(osc);
            } else {
                referenceAudioEndTime = 0;
            }
        }

        checkSound.addEventListener('change', () => {
            if (checkSound.checked) playPianoNote();
            else { 
                activeSynthNodes.forEach(node => { try { node.stop(); } catch(e){} }); 
                referenceAudioEndTime = 0;
            }
        });

        btnNewNote.addEventListener('click', generateRandomNote);
        btnRepeat.addEventListener('click', () => { playPianoNote(); });
        btnSine.addEventListener('click', playSineReference);
        selectSatb.addEventListener('change', generateRandomNote);

        function toggleAutoMode() {
            isAutoMode = !isAutoMode;
            autoHitCounter = 0;
            btnAuto.classList.toggle('auto-active');
            const autoBadge = isAutoMode ? " [🤖 AUTO]" : "";
            targetDisplay.textContent = `Alvo: ${getNoteName(targetMidi)}${autoBadge}`;
        }
        btnAuto.addEventListener('click', toggleAutoMode);

        function toggleHold() {
            isHold = !isHold;
            if (isHold) {
                btnHold.innerHTML = `▶️ Continuar <span class="key-badge">Espaço</span>`;
                btnHold.classList.add('hold-active');
                pauseWatermark.style.display = "block";
            } else {
                btnHold.innerHTML = `⏸️ Congelar / Hold <span class="key-badge">Espaço</span>`;
                btnHold.classList.remove('hold-active');
                pauseWatermark.style.display = "none";
            }
        }
        btnHold.addEventListener('click', toggleHold);

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === "SELECT" || document.activeElement.tagName === "INPUT") {
                if (e.code !== 'Enter' && e.code !== 'NumpadEnter') return;
            }
            if (e.code === 'Space') { 
                e.preventDefault(); toggleHold(); 
            } else if (e.code === 'Enter' || e.code === 'NumpadEnter') { 
                e.preventDefault(); generateRandomNote(); 
            } else if (e.code === 'KeyR') {
                e.preventDefault(); playPianoNote();
            } else if (e.code === 'KeyA') {
                e.preventDefault(); toggleAutoMode();
            }
        });

        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        btnMic.addEventListener('click', async () => {
            await initAudio();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            try {
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, autoGainControl: false, noiseSuppression: false } 
                });
                
                const micSource = audioCtx.createMediaStreamSource(micStream);
                
                const highpassFilter = audioCtx.createBiquadFilter();
                highpassFilter.type = "highpass";
                highpassFilter.frequency.value = 80; 
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                
                micSource.connect(highpassFilter);
                highpassFilter.connect(analyser);
                
                isMicActive = true;
                
                btnMic.classList.remove('blinking-red');
                btnMic.classList.add('active');
                btnMic.innerHTML = `<span class="led-dot"></span> Microfone Ativo`;
                
                voiceDisplay.textContent = "Voz: Cante para detectar...";
                if (targetMidi === 64) generateRandomNote();
                updatePitch();
            } catch (err) { alert("Erro ao acessar microfone. Permita o uso no navegador!"); }
        });

        function autoCorrelate(buf, sampleRate) {
            let size = buf.length; let rms = 0;
            for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
            rms = Math.sqrt(rms / size);
            
            if (rms < 0.018) return -1;

            let r1 = 0, r2 = size - 1, thres = 0.2;
            for (let i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < thres) { r2 = size - i; break; }

            buf = buf.slice(r1, r2); size = buf.length;
            let c = new Array(size).fill(0);
            for (let i = 0; i < size; i++)
                for (let j = 0; j < size - i; j++) c[i] += buf[j] * buf[j + i];

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < size; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            
            if (maxval < 0.15) return -1;

            let T0 = maxpos;
            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2; let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        function updatePitch() {
            if (!isMicActive) return;

            const buf = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buf);
            const freq = autoCorrelate(buf, audioCtx.sampleRate);

            if (!isHold && !isAutoTransitioning) {
                // VERIFICAÇÃO ACÚSTICA: Se o áudio de referência ainda estiver tocando nos alto-falantes,
                // ignoramos o avanço automático para impedir o falso positivo de feedback!
                const isPlayingRef = isAutoMode && audioCtx && (audioCtx.currentTime < referenceAudioEndTime);

                if (isPlayingRef) {
                    voiceDisplay.textContent = "🔊 Escute a nota de referência...";
                    voiceDisplay.classList.remove('in-tune');
                    autoHitCounter = 0;
                } else if (freq !== -1 && freq > 70 && freq < 1200) {
                    currentVoiceMidi = freqToMidi(freq);
                    const diffCents = Math.round((currentVoiceMidi - targetMidi) * 100);
                    const toleranceCents = parseInt(selectTolerance.value);
                    
                    let diffText = "";
                    if (Math.abs(diffCents) <= toleranceCents) {
                        diffText = "🎯 AFINADO!";
                        voiceDisplay.classList.add('in-tune');
                        
                        if (isAutoMode) {
                            autoHitCounter++;
                            if (autoHitCounter >= REQUIRED_HIT_FRAMES) {
                                isAutoTransitioning = true;
                                voiceDisplay.textContent = "🎉 PERFEITO! Gerando próxima...";
                                voiceDisplay.classList.add('auto-success');
                                
                                setTimeout(() => {
                                    voiceDisplay.classList.remove('auto-success');
                                    generateRandomNote();
                                }, 1200);
                            }
                        }
                    } else {
                        diffText = diffCents > 0 ? `+${diffCents}c` : `${diffCents}c`;
                        voiceDisplay.classList.remove('in-tune');
                        if (isAutoMode) autoHitCounter = Math.max(0, autoHitCounter - 2); 
                    }
                    
                    if (!isAutoTransitioning) {
                        voiceDisplay.textContent = `Voz: ${getNoteName(currentVoiceMidi)} | ${diffText}`;
                    }
                    history.push(currentVoiceMidi);
                } else {
                    if (!isAutoTransitioning) voiceDisplay.textContent = "Voz: Cante para detectar...";
                    voiceDisplay.classList.remove('in-tune');
                    if (isAutoMode) autoHitCounter = 0;
                    history.push(null);
                }

                if (history.length > MAX_BUFFER) history.shift();
            }

            requestAnimationFrame(updatePitch);
        }

        // --- RENDERIZAÇÃO DO GRÁFICO ---
        function resizeCanvas() {
            canvas.width = canvasContainer.clientWidth;
            canvas.height = canvasContainer.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 50); 

        function drawLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let minMidiView, maxMidiView;
            const zoomMode = selectZoom.value;
            const currentVoice = selectSatb.value;

            if (zoomMode === 'octave') {
                minMidiView = targetMidi - 6; maxMidiView = targetMidi + 6;
            } else if (zoomMode === 'voice') {
                minMidiView = RANGES[currentVoice].min - 1; maxMidiView = RANGES[currentVoice].max + 1;
            } else if (zoomMode === 'wide') {
                minMidiView = targetMidi - 18; maxMidiView = targetMidi + 18;
            }

            function midiToY(midi) {
                return canvas.height - ((midi - minMidiView) / (maxMidiView - minMidiView)) * canvas.height;
            }

            const secondsView = parseInt(selectTime.value);
            const samplesToDisplay = secondsView * 60;
            const displayHistory = history.slice(-samplesToDisplay);

            ctx.lineWidth = 1; ctx.font = "11px -apple-system, BlinkMacSystemFont, sans-serif";
            for (let m = Math.ceil(minMidiView); m <= Math.floor(maxMidiView); m++) {
                const y = midiToY(m);
                const isTarget = (m === targetMidi);
                ctx.strokeStyle = isTarget ? "rgba(0, 255, 136, 0.25)" : "rgba(255, 255, 255, 0.04)";
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                ctx.fillStyle = isTarget ? "#00ff88" : "rgba(255, 255, 255, 0.25)";
                ctx.fillText(getNoteName(m), 5, y - 4);
            }

            if (checkGreen.checked) {
                const targetY = midiToY(targetMidi);
                ctx.strokeStyle = "#00ff88"; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
                ctx.beginPath(); ctx.moveTo(0, targetY); ctx.lineTo(canvas.width, targetY); ctx.stroke();
                ctx.setLineDash([]);
            }

            if (displayHistory.length > 0) {
                ctx.lineWidth = 3;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                const stepX = canvas.width / samplesToDisplay;
                let isDrawing = false;
                let prevVal = null;
                
                const toleranceSemitones = parseInt(selectTolerance.value) / 100;

                for (let i = 0; i < displayHistory.length; i++) {
                    const val = displayHistory[i];
                    const x = i * stepX;

                    if (val !== null) {
                        const y = midiToY(val);
                        
                        if (prevVal !== null && Math.abs(val - prevVal) > 2.0) {
                            isDrawing = false;
                        }

                        if (Math.abs(val - targetMidi) <= toleranceSemitones) {
                            ctx.strokeStyle = "#00ffff"; 
                        } else {
                            ctx.strokeStyle = "#f43f5e"; 
                        }

                        if (!isDrawing) {
                            ctx.beginPath(); ctx.moveTo(x, y); isDrawing = true;
                        } else {
                            ctx.lineTo(x, y); ctx.stroke();
                            ctx.beginPath(); ctx.moveTo(x, y);
                        }
                        prevVal = val;
                    } else {
                        isDrawing = false;
                        prevVal = null;
                    }
                }
            }

            requestAnimationFrame(drawLoop);
        }

        drawLoop();
    </script>
</body>
