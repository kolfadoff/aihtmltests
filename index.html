<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Projetos — Matt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --primary: #58a6ff;
            --primary-bg: rgba(88, 166, 255, 0.1);
            --badge-bg: #21262d;
            --radius-md: 12px;
            --radius-sm: 6px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
            --transition: all 0.2s ease-in-out;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f6f8fa;
                --surface-color: #ffffff;
                --surface-hover: #f3f4f6;
                --border-color: #d0d7de;
                --text-main: #1f2328;
                --text-muted: #656d76;
                --primary: #0969da;
                --primary-bg: rgba(9, 105, 218, 0.08);
                --badge-bg: #eaeef2;
                --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2.5rem 1.25rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 960px;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .header-title-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        h1 span {
            color: var(--primary);
        }

        .stats-badge {
            font-size: 0.85rem;
            background: var(--primary-bg);
            color: var(--primary);
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        /* Barra de Busca e Filtros */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-size: 1rem;
        }

        .category-filter {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.25rem;
        }

        .filter-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.45rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Grid de Projetos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .card:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.35;
            color: var(--text-main);
        }

        .card-icon {
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.75rem;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .card-tag {
            background: var(--badge-bg);
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            font-weight: 500;
            border: 1px solid var(--border-color);
        }

        .card-arrow {
            color: var(--primary);
            font-weight: 700;
            transition: var(--transition);
        }

        .card:hover .card-arrow {
            transform: translateX(3px);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title-area">
            <h1><span>⚡</span> Hub de Projetos AI</h1>
            <div class="stats-badge" id="stats">0 ferramentas</div>
        </div>

        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar ferramenta por nome ou categoria..." autocomplete="off">
            </div>
            <div class="category-filter" id="filterContainer">
                <!-- Filtros gerados automaticamente -->
            </div>
        </div>
    </header>

    <main class="grid" id="projectGrid">
        <!-- Cards gerados via JavaScript -->
    </main>
</div>

<script>
    // =========================================================================
    // COMO ADICIONAR UM NOVO PROJETO:
    // Basta adicionar uma nova linha com { title, url, category, icon } abaixo!
    // =========================================================================
    const projects = [
        { title: "To Do Diário 1.10", url: "tododiario.html", category: "Organização", icon: "📝" },
        { title: "Diário Inteligente 0.1", url: "diariointeligente.html", category: "Organização", icon: "📓" },
        { title: "Cifras e Letras 0.15", url: "cifraseletras.html", category: "Repertório", icon: "🎶" },
        { title: "Partituras Aleatórias", url: "partituras.html", category: "Repertório", icon: "🎼" },
        { title: "Avaliador", url: "avaliador.html", category: "Estudo", icon: "📝" },
        { title: "Afinador", url: "afinador.html", category: "Voz & Afinação", icon: "🎯" },
        { title: "Cantar Afinado (mod 14-07-2026)", url: "cantarafinado.html", category: "Voz & Afinação", icon: "🎤" },
        { title: "Vocal Hero", url: "vocalhero.html", category: "Voz & Afinação", icon: "🎮" },
        { title: "Karaokê 1.34", url: "karaoke.html", category: "Karaokê", icon: "🎵" },
        { title: "Karaokê Backup (Stable)", url: "karaokebackup.html", category: "Karaokê", icon: "🛡️" },
        { title: "Karaokê Teste", url: "karaoketeste.html", category: "Karaokê", icon: "🧪" },
        { title: "Acordeon — Baixos", url: "accordionbass.html", category: "Harmonia & Prática", icon: "🪗" },
        { title: "Escalas com Timer", url: "estudodeescalas.html", category: "Harmonia & Prática", icon: "⏱️" },
        { title: "Progressões", url: "progressoes.html", category: "Harmonia & Prática", icon: "🎹" },
        { title: "Progressões Aleatórias", url: "progressoes2.html", category: "Harmonia & Prática", icon: "🎲" },
        { title: "Link 4", url: "link3.html", category: "Outros", icon: "🔗" }
    ];

    // =========================================================================
    // LÓGICA DE RENDERIZAÇÃO E FILTRAGEM
    // =========================================================================
    const grid = document.getElementById('projectGrid');
    const searchInput = document.getElementById('searchInput');
    const filterContainer = document.getElementById('filterContainer');
    const stats = document.getElementById('stats');

    let currentCategory = 'Todos';

    function renderFilters() {
        const categories = ['Todos', ...new Set(projects.map(p => p.category))];
        filterContainer.innerHTML = categories.map(cat => `
            <button class="filter-btn ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">
                ${cat}
            </button>
        `).join('');
    }

    function setCategory(cat) {
        currentCategory = cat;
        renderFilters();
        renderProjects();
    }

    function renderProjects() {
        const query = searchInput.value.toLowerCase().trim();

        const filtered = projects.filter(p => {
            const matchesCategory = currentCategory === 'Todos' || p.category === currentCategory;
            const matchesSearch = p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query);
            return matchesCategory && matchesSearch;
        });

        stats.textContent = `${filtered.length} de ${projects.length} ferramentas`;

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state">Nenhuma ferramenta encontrada com o termo pesquisado.</div>`;
            return;
        }

        grid.innerHTML = filtered.map(p => `
            <a href="${p.url}" class="card">
                <div class="card-top">
                    <div class="card-title">${p.title}</div>
                    <div class="card-icon">${p.icon}</div>
                </div>
                <div class="card-meta">
                    <span class="card-tag">${p.category}</span>
                    <span class="card-arrow">Acessar →</span>
                </div>
            </a>
        `).join('');
    }

    searchInput.addEventListener('input', renderProjects);

    // Inicialização
    renderFilters();
    renderProjects();
</script>

</body>
</html>
